
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order iPhone</title>
<link rel="stylesheet" href="order.css">
</head>
<body>

<div class="order-box">
    <img src="ChatGPT Image Sep 25, 2026, 04_58_14 PM.png" alt="" height="50px" width="100px">

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="012345678" required>

        <label>Address</label>
        <textarea rows="3" placeholder="Your address"></textarea>

        <label>Quantity</label>
        <input type="number" value="1" min="1">

        <button type="submit">Confirm Order</button>
    </form>

    <a href="index.html" class="back">← Back to Store</a>
</div>

</body>
</html>
