<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Bootstrap Login</title>

    <style>
        body{
            background: linear-gradient(135deg,rgb(236, 146, 11));
            height:100vh;
        }
        .login-box{
            max-width:400px;
            width:100%;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 login-box">
        <div class="text-center mb-3">
            <h2>Find your account</h2>
            <p class="text-muted">Enter your email address.</p>
        </div>

        <form>

            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Email" required>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <div class="form-check">
                </div>
            </div>

            <button style="margin: 5px;" type="submit" class="btn btn-primary  w-100">
                Continue
            </button>
            <a type="submit" style="margin: 5px;" href="mobile.html" class="btn btn-dark w-100 text-white text-decoration-none">
                Search by mobile number
            </a>
        </form>
    </div>
</div>

</body>
</html>
